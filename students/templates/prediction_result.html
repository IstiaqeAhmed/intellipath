<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student ML Prediction</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #333; }
        .marks { font-size: 18px; color: #555; text-align: left; }
        .result { font-size: 24px; font-weight: bold; margin-top: 20px; color: {{ color }}; }
    </style>
</head>
<body>

    <div class="card">
        <h1>AI Prediction for: {{ student.username }}</h1>
        <hr>
        <div class="marks">
            <p>📝 <b>Exam Score:</b> {{ exam_score }}</p>
            <p>📁 <b>Assignment Score:</b> {{ assign_score }}</p>
            <p>❓ <b>Quiz Score:</b> {{ quiz_score }}</p>
        </div>
        <hr>
        <p class="result">{{ status }}</p>
        <br><a href="{% url 'teacher_dashboard' %}" style="text-decoration:none; color:blue;">🔙 Back to Dashboard</a>
    </div>

</body>
</html>
